name: Linux CI

# podatui-core must stay OS-free, and the Linux crates build on it: lint and test each on Linux.

on:
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'linux/**'
      - '.github/workflows/ci-linux.yml'
  pull_request:
    paths:
      - 'core/**'
      - 'linux/**'
      - '.github/workflows/ci-linux.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [core, linux/daemon]
    defaults:
      run:
        working-directory: ${{ matrix.crate }}

    steps:
      - uses: actions/checkout@v4

      - name: Install D-Bus headers
        if: matrix.crate != 'core'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.crate }} -> target

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test
