name: Core CI (Linux)

# podatui-core must stay OS-free: build, lint and test it on Linux.

on:
  push:
    branches: [main]
    paths:
      - 'core/**'
      - '.github/workflows/ci-core.yml'
  pull_request:
    paths:
      - 'core/**'
      - '.github/workflows/ci-core.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core -> target

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test
